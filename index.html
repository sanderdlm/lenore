<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bankan">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23FF6B6B' width='100' height='100' rx='20'/><text x='50' y='70' font-size='60' text-anchor='middle' fill='white' font-family='Arial'>🧗</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🧗</text></svg>">
    <link rel="stylesheet" href="/styles.css">
    <title>Bankan</title>
</head>
<body>
    <header>
        <details class="problem-form" id="problemForm" open>
            <summary>Add problem</summary>
            
            <div class="form-content">
                <div class="form-group">
                    <label>Hold color</label>
                    <div class="color-palette" id="holdColorPalette"></div>
                </div>

                <div class="form-group">
                    <label>Grade color</label>
                    <div class="color-palette" id="gradeColorPalette"></div>
                </div>

                <button class="btn-primary" id="addProblemBtn">Add Problem</button>
            </div>
        </details>
    </header>

    <main>
        <section class="problems-list" id="problemsList">
            <!-- Problems will be added here dynamically -->
        </section>
    </main>

    <footer>
        <div class="timer-section">
            <div class="timer-display" id="timerDisplay">--:--</div>
            <div class="timer-controls" id="timerControls">
                <button class="timer-btn" data-minutes="1">1m</button>
                <button class="timer-btn" data-minutes="2">2m</button>
                <button class="timer-btn" data-minutes="3">3m</button>
                <button class="timer-btn" data-minutes="4">4m</button>
                <button class="timer-btn" data-minutes="5">5m</button>
            </div>
        </div>
        <button class="btn-danger" id="clearSessionBtn">Clear Session</button>
    </footer>

    <script type="module" src="/app.js"></script>
</body>
</html>
