<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (white, safe for iOS masking) -->
  <rect width="512" height="512" fill="#ffffff"></rect>

  <!-- Layout constants:
       - Icon padding: 64
       - Square size: 160
       - Gap: 32
       - Corner radius: 32
  -->

  <!-- Top-left (green) -->
  <rect x="64" y="64" width="160" height="160" rx="32" fill="#57C77A"></rect>

  <!-- Top-right (yellow) -->
  <rect x="288" y="64" width="160" height="160" rx="32" fill="#FFD84A"></rect>

  <!-- Bottom-left (dark) -->
  <rect x="64" y="288" width="160" height="160" rx="32" fill="#2B2D2F"></rect>

  <!-- Bottom-right (white with subtle stroke for separation) -->
  <rect x="288" y="288" width="160" height="160" rx="32" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2"></rect>
</svg>
